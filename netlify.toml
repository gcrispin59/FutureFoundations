[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  targetPort = 3999

# Environment-specific settings
[context.production.environment]
  FUTURE_FOUNDATIONS_ENV = "production"

[context.deploy-preview.environment]
  FUTURE_FOUNDATIONS_ENV = "preview"

[context.branch-deploy.environment]
  FUTURE_FOUNDATIONS_ENV = "branch"

# Square donation API — set SQUARE_* in Netlify UI (see Media/donations/SQUARE_SETUP.md)

[[redirects]]
  from = "/api/square-donate"
  to = "/.netlify/functions/square-donate"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
